# Gradle daemon memory. Compose + R8 builds like a generous heap.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is the only supported support-library flavour.
android.useAndroidX=true
# Each module gets its own R class (smaller, faster builds).
android.nonTransitiveRClass=true

kotlin.code.style=official

# App version (see app/build.gradle.kts and docs/releasing.md). The release workflow overrides it
# with -Panprox.versionName=<tag without the leading v>.
anprox.versionName=0.1.0-beta.3
