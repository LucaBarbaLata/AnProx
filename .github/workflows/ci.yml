# Continuous integration: runs on every push and pull request.
#  1. Unit + integration tests of the pure-Kotlin modules (against the mock Proxmox server).
#  2. Android lint and a debug + release (R8-minified, unsigned) build of the app.
#  3. Uploads the debug APK so it can be installed on a phone straight from the run page.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and integration tests
        run: ./gradlew --stacktrace test

      - name: Android lint
        run: ./gradlew --stacktrace :app:lintDebug

      - name: Build debug and release APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anprox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
