# Continuous integration: runs on every push and pull request.
#  build: JVM tests (against the mock Proxmox server), Android lint, debug + release builds,
#         debug APK uploaded as an artifact.
#  e2e:   installs the real R8-minified release APK on emulators (Android 8.0 = minSdk, and 14)
#         and drives it through scripts/e2e/tour.py against the mock server. Screenshots are
#         uploaded as artifacts.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and integration tests
        run: ./gradlew --stacktrace test

      - name: Android lint
        run: ./gradlew --stacktrace :app:lintDebug

      - name: Build debug and release APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: anprox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  e2e:
    name: e2e (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 34]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (signed with the debug key) and the mock server
        run: ./gradlew --stacktrace :app:assembleRelease :tools:mock-server:installDist -Panprox.signWithDebugKey=true

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: End-to-end tour on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANPROX_E2E_OUT: e2e-output
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/e2e/run.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-api-${{ matrix.api-level }}
          path: e2e-output/
          if-no-files-found: ignore
