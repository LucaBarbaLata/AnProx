# Release: builds, signs, tests and publishes an AnProx release on GitHub.
#
# Start it either way (see docs/releasing.md):
#   • Actions → Release → "Run workflow", enter a version such as 0.1.0-beta.1.
#     Leave "dry run" ticked first: it signs with a throwaway debug key, runs everything and
#     uploads the result as an artifact without publishing anything.
#   • or push a tag:  git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1
#
# Publishing needs four repository secrets (Settings → Secrets and variables → Actions):
#   ANPROX_KEYSTORE_BASE64, ANPROX_KEYSTORE_PASSWORD, ANPROX_KEY_ALIAS, ANPROX_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, e.g. 0.1.0-beta.1'
        required: true
      dry_run:
        description: 'Dry run (debug-key signature, nothing is published)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"; DRY_RUN=false
          else
            VERSION="${INPUT_VERSION#v}"; DRY_RUN="$INPUT_DRY_RUN"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid version (expected e.g. 1.2.3 or 1.2.3-beta.4)"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$DRY_RUN" != "true" ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. Pick a new version."; exit 1
          fi
          PRERELEASE=false; [[ "$VERSION" == *-* ]] && PRERELEASE=true
          {
            echo "version=$VERSION"
            echo "dry_run=$DRY_RUN"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "### AnProx $VERSION — $([ "$DRY_RUN" = true ] && echo 'dry run' || echo 'release')" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up the release signing key
        if: steps.version.outputs.dry_run != 'true'
        env:
          ANPROX_KEYSTORE_BASE64: ${{ secrets.ANPROX_KEYSTORE_BASE64 }}
          ANPROX_KEYSTORE_PASSWORD: ${{ secrets.ANPROX_KEYSTORE_PASSWORD }}
          ANPROX_KEY_ALIAS: ${{ secrets.ANPROX_KEY_ALIAS }}
          ANPROX_KEY_PASSWORD: ${{ secrets.ANPROX_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANPROX_KEYSTORE_BASE64 ANPROX_KEYSTORE_PASSWORD ANPROX_KEY_ALIAS ANPROX_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/releasing.md → One-time setup."; exit 1
          fi
          echo "$ANPROX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anprox-release.jks"
          echo "ANPROX_KEYSTORE_FILE=$RUNNER_TEMP/anprox-release.jks" >> "$GITHUB_ENV"

      - name: Unit and integration tests
        run: ./gradlew --stacktrace test

      - name: Build the release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ steps.version.outputs.dry_run }}
          ANPROX_KEYSTORE_PASSWORD: ${{ secrets.ANPROX_KEYSTORE_PASSWORD }}
          ANPROX_KEY_ALIAS: ${{ secrets.ANPROX_KEY_ALIAS }}
          ANPROX_KEY_PASSWORD: ${{ secrets.ANPROX_KEY_PASSWORD }}
        run: |
          EXTRA=""
          [ "$DRY_RUN" = "true" ] && EXTRA="-Panprox.signWithDebugKey=true"
          ./gradlew --stacktrace :app:assembleRelease :tools:mock-server:installDist -Panprox.versionName="$VERSION" $EXTRA

      - name: Verify signature and version, compute checksum
        id: verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=app/build/outputs/apk/release/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee signing.txt
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -1 | tee badging.txt
          grep -q "versionName='$VERSION'" badging.txt || { echo "::error::APK versionName is not $VERSION"; exit 1; }
          CERT="$(grep -m1 'certificate SHA-256 digest' signing.txt | awk -F': ' '{print $2}')"
          mkdir -p dist
          cp "$APK" "dist/AnProx-$VERSION.apk"
          (cd dist && sha256sum "AnProx-$VERSION.apk" > "AnProx-$VERSION.apk.sha256")
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          {
            echo "- versionCode/versionName: \`$(grep -o "versionCode='[0-9]*'" badging.txt)\` \`$VERSION\`"
            echo "- Signing certificate SHA-256: \`$CERT\`"
            echo "- APK SHA-256: \`$(cut -d' ' -f1 "dist/AnProx-$VERSION.apk.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: End-to-end tour of the release APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANPROX_E2E_OUT: e2e-output
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/e2e/run.sh dist/AnProx-${{ steps.version.outputs.version }}.apk

      - name: Release notes and screenshots
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CERT: ${{ steps.verify.outputs.cert }}
        run: |
          python3 scripts/release/notes.py "$VERSION" "$CERT" > dist/release-notes.md
          (cd e2e-output && zip -q "../dist/AnProx-$VERSION-screenshots.zip" ./*.png)
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build (always, for inspection)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anprox-${{ steps.version.outputs.version }}${{ steps.version.outputs.dry_run == 'true' && '-dry-run' || '' }}
          path: |
            dist/
            e2e-output/
          if-no-files-found: warn

      - name: Publish the GitHub release
        if: steps.version.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          gh release create "v$VERSION" \
            "dist/AnProx-$VERSION.apk" \
            "dist/AnProx-$VERSION.apk.sha256" \
            "dist/AnProx-$VERSION-screenshots.zip" \
            --title "AnProx $VERSION" \
            --notes-file dist/release-notes.md \
            --target "$GITHUB_SHA" \
            $FLAGS
