# Real-server tests against the owner's test Proxmox VE. Started by hand (Actions → Real server
# tests → Run workflow), or by a push that changes .github/real-server-run (a line "write" in it
# turns the write test on). Never on pull requests, so the secrets are not handed to other code.
#  RealServerSmokeTest: every read the app makes, read-only.
#  RealServerWriteTest (with "write" ticked): creates, changes and deletes its own anprox-test…
#                      objects, for test servers only.
# Repository secrets: ANPROX_PVE_URL (https://host:8006), ANPROX_PVE_USER (user@realm; @pam is
# added when the realm is missing) and ANPROX_PVE_PASSWORD. See docs/testing.md.
name: Real server tests

on:
  push:
    paths: ['.github/real-server-run']
  workflow_dispatch:
    inputs:
      write:
        description: Also create, change and delete test objects (test servers only)
        type: boolean
        default: false

concurrency:
  group: real-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Real-server tests
        env:
          ANPROX_PVE_URL: ${{ secrets.ANPROX_PVE_URL }}
          PVE_USER: ${{ secrets.ANPROX_PVE_USER }}
          ANPROX_PVE_PASSWORD: ${{ secrets.ANPROX_PVE_PASSWORD }}
          WRITE_INPUT: ${{ inputs.write && '1' || '0' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          if [ "$EVENT" = "push" ]; then
            if grep -qx 'write' .github/real-server-run; then export ANPROX_PVE_WRITE=1; else export ANPROX_PVE_WRITE=0; fi
          else
            export ANPROX_PVE_WRITE="$WRITE_INPUT"
          fi
          for v in ANPROX_PVE_URL PVE_USER ANPROX_PVE_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::The repository secret for $v is not set"; exit 1; fi
          done
          case "$PVE_USER" in *@*) export ANPROX_PVE_USER="$PVE_USER" ;; *) export ANPROX_PVE_USER="$PVE_USER@pam" ;; esac
          echo "Signing in as $ANPROX_PVE_USER, write steps: $ANPROX_PVE_WRITE"
          status=0
          ./gradlew --stacktrace -Panprox.jvmOnly=true :core:data:test --tests '*RealServer*' -i > real-server.log 2>&1 || status=$?
          # The checks' own lines, then the result of each test.
          grep -E '^ +(✓|✗|–) |^ +(Working on|Dashboard|Node|Storage|Guests|Datacenter|VM|Container|Firewall|SDN|Users and groups|Leftovers|Cleaning up|All |Failed)|RealServer.* (PASSED|FAILED|SKIPPED)|^ +[a-zA-Z].*: (ApiException|IllegalState|Serialization)' real-server.log || true
          # One line per test, so a skipped real-server test can't pass unnoticed.
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("| Test | Result |\n|---|---|")
          for f in sorted(glob.glob("core/data/build/test-results/test/TEST-*RealServer*.xml")):
              root = ET.parse(f).getroot()
              for case in root.iter("testcase"):
                  state = "FAILED" if case.find("failure") is not None else "SKIPPED" if case.find("skipped") is not None else "PASSED"
                  print(f"| {root.get('name').rsplit('.', 1)[-1]} > {case.get('name')} | {state} |")
          PY
          if [ "$status" -ne 0 ]; then
            echo "::error::Real-server tests failed (exit $status); the full log is in the artifact"
            grep -E 'FAILED|Exception|expected' real-server.log | head -60 || true
          fi
          exit $status

      - name: Upload the full log and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-server-tests
          path: |
            real-server.log
            core/data/build/reports/tests/
            core/data/build/test-results/
          if-no-files-found: ignore
