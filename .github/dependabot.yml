# Weekly dependency update PRs for the Gradle version catalog and GitHub Actions.
version: 2
# Note: Dependabot PRs target the default branch.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
      ktor:
        patterns: ["io.ktor*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
